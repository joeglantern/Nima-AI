# Garage in production.
#
# Single node, which is what one VPS is. The replication factor stays at one
# because there is nowhere to replicate to; backups are taken from the data
# directory rather than by running a cluster of one and pretending.
#
# `rpc_secret` and `admin_token` are read from the environment rather than
# written here, so this file can live in the repository. Compose passes them
# in from .env.prod.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.nima.internal"

[admin]
api_bind_addr = "[::]:3903"
