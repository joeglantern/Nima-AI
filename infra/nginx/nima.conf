# nima.afosihub.com
#
# Installed on the host, not in a container, because nginx on this box is
# already the single front door for every project on it. Nothing of Nima's
# listens on a public interface: this is the only way in.
#
#   sudo cp infra/nginx/nima.conf /etc/nginx/sites-available/nima.afosihub.com
#   sudo ln -s /etc/nginx/sites-available/nima.afosihub.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nima.afosihub.com
#
# certbot adds the 443 block and the redirect to this file itself.

server {
    server_name nima.afosihub.com;

    # Photographs and generated try-ons go through the API, which signs a
    # URL and redirects. They are large and they are cacheable.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The try-on progress socket. Without these the connection is closed
        # as soon as it is upgraded and the app falls back to looking stuck.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A try-on takes half a minute. The default 60s is enough today but
        # leaves no room, and a timeout here looks like a failed generation.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    listen 80;
}
