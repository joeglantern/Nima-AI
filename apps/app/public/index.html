    <style id="expo-reset">
      html,

      }

        overflow: hidden;

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1A1614;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
